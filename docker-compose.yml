services:
  gymdb:
    image: postgres:16
    container_name: gym-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gymdb}
    ports:
      - '54321:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: